# AuroraOS picom configuration.
# Goals: rounded corners on every window, soft drop shadow, smooth fade animations,
# subtle background blur on popovers/start menu.  Win11-like.

backend = "xrender";
vsync = false;
use-damage = true;

# --- Shadows --------------------------------------------------------------
shadow = true;
shadow-radius = 20;
shadow-opacity = 0.45;
shadow-offset-x = 0;
shadow-offset-y = 8;
shadow-color = "#000000";
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "_GTK_FRAME_EXTENTS@:c"
];

# --- Rounded corners ------------------------------------------------------
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];
round-borders = 1;

# --- Fading animations ----------------------------------------------------
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;

# --- Blur (disabled in v1.2 - dual_kawase requires GLX which Hyper-V's   --
# --- hyperv_drm framebuffer does not provide.  Re-enable on hardware     --
# --- with hardware GL.) -----------------------------------------------
blur-method = "none";

# --- Transparency rules ---------------------------------------------------
opacity-rule = [
  "92:class_g = 'tint2'",
  "94:class_g = 'jgmenu'",
  "95:class_g = 'Rofi'",
  "98:class_g = 'XTerm'",
  "98:class_g = 'Xfce4-terminal' && focused",
  "92:class_g = 'Xfce4-terminal' && !focused"
];
inactive-opacity = 0.97;
active-opacity = 1.0;
frame-opacity = 1.0;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

# Window types
wintypes:
{
  tooltip   = { fade = true; shadow = true; opacity = 0.92; };
  dock      = { shadow = false; };
  dnd       = { shadow = false; };
  popup_menu= { opacity = 0.96; };
  dropdown_menu = { opacity = 0.96; };
};
